<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4eee2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1b18" />
    <meta name="description" content="A quiet place to keep the walks worth remembering." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wandr</title>
    <noscript
      ><style>
        #boot-mark {
          display: none !important;
        }
      </style></noscript
    >
  </head>

    <noscript>
      <main style="padding: 3rem 1rem; text-align: center">
        <h1>Wandr needs JavaScript.</h1>
        <p>Turn it on, then reload the page.</p>
      </main>
    </noscript>
    <div id="root">
      <div id="boot-mark" style="display: grid; min-height: 100vh; place-items: center">
        <img src="/favicon.svg" alt="Loading" width="64" height="64" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
