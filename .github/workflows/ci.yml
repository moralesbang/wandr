name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # oxlint's JS plugins and their RuleTester run in Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Postgres and the S3-compatible bucket the API tests run against.
      - run: bun run services

      - run: bunx turbo run lint typecheck test build

      - name: Format
        run: bunx oxfmt --check

      - name: Generated files match the code
        run: |
          bunx turbo run codegen
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.gen.ts apps/web/src/route-tree.gen.ts \
            || { echo "::error::Generated files are stale. Run 'bun run codegen' and 'bun run build', then commit them."; exit 1; }

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run services

      - run: bun run --cwd apps/api db:migrate:test

      - run: cd apps/web && bunx playwright install --with-deps chromium webkit

      - run: bunx turbo run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one required check on main: it passes only when every job above does.
  ci:
    name: CI
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
